                    - $.buckets['{#SUBID}/{#BUCKET}'].storageWrote
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000000'
              description: 'Unite supposee To, non recoupee sur des donnees reelles.'
              tags:
                - tag: subaccount
