                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000000'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: component
                  value: storage

            - uuid: '1371e4f01ac846ddbade3ef7e82e149f'
