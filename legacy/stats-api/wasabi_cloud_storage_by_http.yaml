zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 2aeefb8933744ea6a798fc9435dc9baf
      name: 'Templates/Cloud'
  templates:
    - uuid: a3a97cd8c16d42be95072b1a6c116038
      template: 'Wasabi Cloud Storage by HTTP'
      name: 'Wasabi Cloud Storage by HTTP'
      description: |
        Supervision d'un compte Wasabi et de tous ses buckets via la Wasabi Stats API.

        Endpoints utilises :
          GET https://stats.wasabisys.com/v1/standalone/utilizations
          GET https://stats.wasabisys.com/v1/standalone/utilizations/buckets
          GET https://stats.wasabisys.com/v1/standalone/utilizations/bucket/{bucket}

        Authentification : header "Authorization: <AccessKey>:<SecretKey>".
        La cle doit etre une cle ROOT ou disposer de la permission "billing".
        Ce sont des cles Wasabi S3/IAM, PAS des cles WACM / Account Control.

        IMPORTANT : la Stats API produit un enregistrement par JOUR. Les compteurs
        (appels API, upload/download) sont des totaux journaliers, pas des compteurs
        monotones : ne leur appliquez pas "Change per second". Un intervalle de
        collecte de 1h est largement suffisant.

        Prerequis :
          1. Renseigner {$WASABI.ACCESS.KEY} et {$WASABI.SECRET.KEY} sur l'hote.
          2. Le serveur ou proxy Zabbix doit joindre https://stats.wasabisys.com.
          3. Zabbix >= 6.0 (item de type Script). Export au format 7.0.
      vendor:
        name: Community
        version: 7.0-1
      groups:
        - name: 'Templates/Cloud'
      items:
        - uuid: 473b47f7589544899d1824ba5d86c411
          name: 'Wasabi: Get utilization data'
          type: SCRIPT
          key: wasabi.get.utilization
          delay: 1h
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            var params = JSON.parse(value);

            var baseUrl = (params.base_url || 'https://stats.wasabisys.com').replace(/\/+$/, '');
            var accessKey = params.access_key || '';
            var secretKey = params.secret_key || '';
            var maxPages = parseInt(params.max_pages || '20', 10);

            if (accessKey === '' || accessKey.indexOf('{$') === 0) {
                throw 'Wasabi access key is not set - fill the {$WASABI.ACCESS.KEY} macro.';
            }
            if (secretKey === '' || secretKey.indexOf('{$') === 0) {
                throw 'Wasabi secret key is not set - fill the {$WASABI.SECRET.KEY} macro.';
            }

            function apiGet(path) {
                var req = new HttpRequest();

                if (params.proxy) {
                    req.setHttpProxy(params.proxy);
                }
                req.addHeader('Authorization: ' + accessKey + ':' + secretKey);
                req.addHeader('Accept: application/json');

                var body = req.get(baseUrl + path);
                var status = req.getStatus();

                // 404 = endpoint not available here, let the caller fall back
                if (status === 404) {
                    return null;
                }
                if (status === 401 || status === 403) {
                    throw 'Authentication failed (HTTP ' + status + '). The key must be a root key '
                        + 'or carry the billing permission.';
                }
                if (status < 200 || status >= 300) {
                    throw 'Request to ' + path + ' failed: HTTP ' + status + ' '
                        + String(body).substring(0, 200);
                }
                try {
                    return JSON.parse(body);
                }
                catch (e) {
                    throw 'Cannot parse JSON response from ' + path;
                }
            }

            function toEpoch(s) {
                if (!s) {
                    return null;
                }
                var t = Date.parse(s);
                return isNaN(t) ? null : Math.floor(t / 1000);
            }

            var now = Math.floor(Date.now() / 1000);
            var out = { account: {}, buckets: {}, discovery: [], bucket_count: 0 };

            // ---------- account level ----------
            var acct = apiGet('/v1/standalone/utilizations?latest=true&pageSize=100');
            var arecs = (acct && acct.Records) ? acct.Records : [];
            var best = null;

            for (var i = 0; i < arecs.length; i++) {
                if (best === null) {
                    best = arecs[i];
                    continue;
                }
                var eNew = toEpoch(arecs[i].EndTime);
                var eOld = toEpoch(best.EndTime);
                if (eNew !== null && (eOld === null || eNew > eOld)) {
                    best = arecs[i];
                }
            }
            if (best === null) {
                throw 'The Stats API returned no account utilization record.';
            }

            var aEnd = toEpoch(best.EndTime);
            best.age_seconds = (aEnd === null) ? -1 : (now - aEnd);
            out.account = best;

            // ---------- bucket level ----------
            function collectAllBuckets() {
                var records = [], page = 0, pageCount = 1;

                while (page < pageCount && page < maxPages) {
                    var r = apiGet('/v1/standalone/utilizations/buckets'
                        + '?latest=true&pageSize=100&pageNum=' + page);
                    if (r === null) {
                        return null;
                    }
                    var recs = r.Records || [];
                    for (var i = 0; i < recs.length; i++) {
                        records.push(recs[i]);
                    }
                    pageCount = (r.PageInfo && r.PageInfo.PageCount) ? r.PageInfo.PageCount : 1;
                    page++;
                    if (recs.length === 0) {
                        break;
                    }
                }
                return records;
            }

            function collectListedBuckets() {
                var names = String(params.buckets || '').split(',');
                var records = [];

                for (var n = 0; n < names.length; n++) {
                    var name = names[n].replace(/^\s+|\s+$/g, '');
                    if (name === '' || name.indexOf('{$') === 0) {
                        continue;
                    }
                    var r = apiGet('/v1/standalone/utilizations/bucket/'
                        + encodeURIComponent(name) + '?latest=true&pageSize=1');
                    if (r && r.Records) {
                        for (var k = 0; k < r.Records.length; k++) {
                            records.push(r.Records[k]);
                        }
                    }
                }
                return records;
            }

            var brecs = collectAllBuckets();

            if (brecs === null || brecs.length === 0) {
                brecs = collectListedBuckets();
                if (brecs.length === 0) {
                    throw 'No bucket utilization returned. The /utilizations/buckets endpoint is '
                        + 'unavailable for this account and the {$WASABI.BUCKETS} macro is empty.';
                }
            }

            for (var j = 0; j < brecs.length; j++) {
                var rec = brecs[j];
                var bname = rec.Bucket;
                if (!bname) {
                    continue;
                }
                var cur = out.buckets[bname];
                if (cur) {
                    var eCur = toEpoch(cur.EndTime) || 0;
                    var eRec = toEpoch(rec.EndTime) || 0;
                    if (eCur >= eRec) {
                        continue;
                    }
                }
                var bEnd = toEpoch(rec.EndTime);
                rec.age_seconds = (bEnd === null) ? -1 : (now - bEnd);
                out.buckets[bname] = rec;
            }

            var keys = Object.keys(out.buckets);
            for (var q = 0; q < keys.length; q++) {
                out.discovery.push({
                    '{#BUCKET}': keys[q],
                    '{#REGION}': out.buckets[keys[q]].Region || 'unknown',
                    '{#BUCKETNUM}': String(out.buckets[keys[q]].BucketNum || '')
                });
            }
            out.bucket_count = keys.length;

            return JSON.stringify(out);
          timeout: 60s
          parameters:
            - name: access_key
              value: '{$WASABI.ACCESS.KEY}'
            - name: secret_key
              value: '{$WASABI.SECRET.KEY}'
            - name: base_url
              value: '{$WASABI.API.URL}'
            - name: buckets
              value: '{$WASABI.BUCKETS}'
            - name: max_pages
              value: '{$WASABI.API.MAX_PAGES}'
            - name: proxy
              value: '{$WASABI.HTTP.PROXY}'
          description: |
            Item maitre. Interroge la Wasabi Stats API et renvoie un JSON unique
            contenant l'utilisation du compte et la derniere utilisation de chaque
            bucket. Tous les autres items en dependent.
          tags:
            - tag: component
              value: raw

        - uuid: e2ef188984c74ad0b90fc767a49b17d1
          name: 'Wasabi: Account number'
          type: DEPENDENT
          key: wasabi.account.num
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: wasabi.get.utilization
          preprocessing:
