                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: component
                  value: inventory

            - uuid: '64d83ab4e0ce473a929714e33294fa96'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Deleted'
              type: DEPENDENT
              key: 'wasabi.bucket.is_deleted["{#SUBID}","{#BUCKET}"]'
              delay: '0'
              value_type: UNSIGNED
              valuemap:
                name: 'Yes/No'
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.buckets['{#SUBID}/{#BUCKET}'].is_deleted
                  error_handler: DISCARD_VALUE
              description: 'Le bucket a ete supprime mais reste facture le temps de la retention.'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: component
                  value: lifecycle

            - uuid: '8fd29813a045420cbf2be2dc5479ad38'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Deletion date'
              type: DEPENDENT
              key: 'wasabi.bucket.delete_time["{#SUBID}","{#BUCKET}"]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: CHAR
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.buckets['{#SUBID}/{#BUCKET}'].delete_time
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: component
                  value: lifecycle

            - uuid: '8785a29d8cca48f388135c58cb399e62'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Utilization data age'
              type: DEPENDENT
              key: 'wasabi.bucket.data_age["{#SUBID}","{#BUCKET}"]'
              delay: '0'
              value_type: FLOAT
              units: s
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.buckets['{#SUBID}/{#BUCKET}'].age_seconds
                  error_handler: DISCARD_VALUE
              description: 'Ecart entre maintenant et le champ endTime du releve.'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: component
                  value: health

          trigger_prototypes:
            - uuid: 'aba71df844f84a7fbe28ed206a5becd0'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.bucket.storage.active["{#SUBID}","{#BUCKET}"])>{$WASABI.BUCKET.STORAGE.MAX:"{#BUCKET}"}'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Storage size is too high'
              priority: WARNING
              description: |
                Seuil surchargeable par bucket via un contexte de macro :
                {$WASABI.BUCKET.STORAGE.MAX:"nom-du-bucket"} = 5T
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: scope
                  value: capacity

            - uuid: '1492777fbacc4d24a1474c3365e06738'
              expression: 'change(/Wasabi WACM Connect by HTTP/wasabi.bucket.storage.active["{#SUBID}","{#BUCKET}"])<0 and abs(change(/Wasabi WACM Connect by HTTP/wasabi.bucket.storage.active["{#SUBID}","{#BUCKET}"]))>last(/Wasabi WACM Connect by HTTP/wasabi.bucket.storage.active["{#SUBID}","{#BUCKET}"],#2)*{$WASABI.BUCKET.DROP.PCT}/100'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Storage dropped by more than {$WASABI.BUCKET.DROP.PCT}%'
              priority: AVERAGE
              manual_close: 'YES'
              description: |
                Chute brutale du volume : suppression massive, lifecycle mal regle
                ou compromission. A verifier.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: scope
                  value: security

            - uuid: 'a5a6438042ca4e2398412d7ecab68079'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.bucket.is_deleted["{#SUBID}","{#BUCKET}"])=1 and last(/Wasabi WACM Connect by HTTP/wasabi.bucket.storage.deleted["{#SUBID}","{#BUCKET}"])>{$WASABI.DELETED.BILLED.MIN}'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Deleted but still billed'
              priority: INFO
              manual_close: 'YES'
              description: |
                Le bucket est supprime mais son contenu reste facture au titre de la
                retention minimale de 90 jours. L'alerte disparaitra d'elle-meme a
                l'issue de cette periode.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: scope
                  value: cost

            - uuid: '9354eaf8688c4063b2ef57000cac4f8d'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.bucket.data_age["{#SUBID}","{#BUCKET}"])>{$WASABI.DATA.MAX_AGE}'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Utilization data is stale'
              priority: WARNING
              description: 'Aucun nouveau releve depuis {$WASABI.DATA.MAX_AGE}.'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: scope
                  value: availability

          graph_prototypes:
            - uuid: '713b6a358952440bb4d3574b507e2b82'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Storage'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Wasabi WACM Connect by HTTP'
                    key: 'wasabi.bucket.storage.active["{#SUBID}","{#BUCKET}"]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'Wasabi WACM Connect by HTTP'
                    key: 'wasabi.bucket.storage.deleted["{#SUBID}","{#BUCKET}"]'

      dashboards:
        - uuid: '0624b57d10e7415683ee9775764a641b'
          name: 'Wasabi overview'
          pages:
            - widgets:
                - type: item
                  name: 'Stockage actif du parc'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.total.storage.active
                - type: item
                  name: 'Stockage supprime facture'
                  x: '18'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.total.storage.deleted
                - type: item
                  name: 'Occupation du quota vendu'
                  x: '36'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.total.quota.pct
                - type: item
                  name: 'Sous-comptes'
                  x: '54'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.wacm.accounts.count
                - type: item
                  name: 'Buckets'
                  'y': '3'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.wacm.buckets.count
                - type: item
                  name: 'Part de donnees supprimees'
                  x: '18'
                  'y': '3'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.total.deleted.pct
                - type: item
                  name: 'Egress 30 jours'
                  x: '36'
                  'y': '3'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.total.egress.30d
                - type: item
                  name: 'Duree de collecte'
                  x: '54'
                  'y': '3'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.wacm.duration
                - type: problems
                  name: 'Problemes en cours'
                  'y': '6'
                  width: '72'
                  height: '8'

      tags:
        - tag: class
          value: cloud
        - tag: target
          value: wasabi

      macros:
        - macro: '{$WASABI.WACM.USER}'
          description: |
            Identifiant HTTP Basic. Pour une cle utilisateur : votre login WACM
            (ex. prenom.nom@societe.fr). Pour une cle de compte : le nom du compte.
            Ce n'est JAMAIS le nom donne a la cle.
        - macro: '{$WASABI.WACM.KEY}'
          type: SECRET_TEXT
          description: 'Cle API WACM Connect.'
        - macro: '{$WASABI.WACM.URL}'
          value: 'https://api.wacm.wasabisys.com'
          description: 'URL de base de la WACM Connect API.'
        - macro: '{$WASABI.HTTP.PROXY}'
          value: ''
          description: 'Proxy HTTP sortant, ex. http://proxy.local:3128. Vide = pas de proxy.'
        - macro: '{$WASABI.SUBACCOUNT.MAX}'
          value: '50'
          description: |
            Nombre maximal de sous-comptes traites par collecte. Chaque sous-compte
            coute un appel API supplementaire. Si ce plafond est atteint, l'item
            "Sub-account list truncated" passe a 1 et un trigger se declenche :
            des comptes ne sont alors plus supervises.
        - macro: '{$WASABI.SUBACCOUNT.STATUS}'
          value: ''
          description: |
            Filtre de statut applique AVANT la recuperation des buckets, pour
            economiser des appels. Ex. : PAID_ACCOUNT,ON_TRIAL
            Vide = tous les sous-comptes.
        - macro: '{$WASABI.SUBACCOUNT.INCLUDE_DELETED}'
          value: 'false'
          description: 'Mettre a true pour inclure les sous-comptes supprimes.'
        - macro: '{$WASABI.SUBACCOUNT.MATCHES}'
          value: '.*'
          description: 'LLD : ne decouvrir que les sous-comptes dont le nom correspond.'
        - macro: '{$WASABI.SUBACCOUNT.NOT_MATCHES}'
          value: 'CHANGE_IF_NEEDED'
          description: 'LLD : ignorer les sous-comptes dont le nom correspond.'
        - macro: '{$WASABI.BUCKET.MATCHES}'
          value: '.*'
          description: 'LLD : ne decouvrir que les buckets dont le nom correspond.'
        - macro: '{$WASABI.BUCKET.NOT_MATCHES}'
          value: 'CHANGE_IF_NEEDED'
          description: 'LLD : ignorer les buckets dont le nom correspond.'
        - macro: '{$WASABI.QUOTA.WARN}'
          value: '75'
          description: 'Premier seuil de quota (%), aligne sur les alertes WACM.'
        - macro: '{$WASABI.QUOTA.HIGH}'
          value: '90'
          description: 'Deuxieme seuil de quota (%).'
        - macro: '{$WASABI.QUOTA.CRIT}'
          value: '100'
          description: 'Quota depasse (%).'
        - macro: '{$WASABI.TRIAL.DAYS.WARN}'
          value: '7'
          description: 'Alerter quand une periode d''essai expire dans moins de N jours.'
        - macro: '{$WASABI.BUCKET.STORAGE.MAX}'
          value: 10T
          description: 'Seuil d''alerte de volume par bucket. Surchargeable par contexte.'
        - macro: '{$WASABI.BUCKET.DROP.PCT}'
          value: '20'
          description: 'Pourcentage de chute de volume declenchant une alerte.'
        - macro: '{$WASABI.DELETED.BILLED.MIN}'
          value: 1G
          description: |
            Volume supprime minimal, sur un bucket lui-meme supprime, a partir
            duquel on signale que la facturation continue.
        - macro: '{$WASABI.DATA.MAX_AGE}'
          value: 48h
          description: 'Age maximal d''un releve avant alerte.'
        - macro: '{$WASABI.MFA.ALERT}'
          value: '1'
          description: 'Mettre a 0 pour ne pas alerter sur les sous-comptes sans MFA.'
        - macro: '{$WASABI.DURATION.MAX}'
          value: '45'
          description: |
            Duree de collecte (s) au-dela de laquelle on alerte. Le timeout dur
            de l'item maitre est de 60 s.

      valuemaps:
        - uuid: 'f61e8b0732154c578831b4323999243d'
          name: 'Enabled/Disabled'
          mappings:
            - value: '0'
              newvalue: Disabled
            - value: '1'
              newvalue: Enabled
        - uuid: 'bc2fdb4c98e54e61a312afda9940942b'
          name: 'Yes/No'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'

  triggers:
    - uuid: 'a62bd61b8cec4339b69cb7f895838711'
      expression: 'nodata(/Wasabi WACM Connect by HTTP/wasabi.wacm.get,3h)=1'
      name: 'Wasabi: Failed to get data from the WACM Connect API'
      priority: AVERAGE
      description: |
        Aucune donnee depuis 3h. Verifier :
        - {$WASABI.WACM.USER} : c'est le LOGIN WACM, pas le nom de la cle ;
        - {$WASABI.WACM.KEY} ;
        - la joignabilite de https://api.wacm.wasabisys.com depuis Zabbix ;
        - l'erreur exacte dans Latest data, item "Wasabi: Get WACM data".
      tags:
        - tag: scope
          value: availability

    - uuid: 'b7974c4e89404be693c022e688e9e632'
      expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.wacm.accounts.count)=0'
      name: 'Wasabi: No sub-account visible'
      priority: WARNING
      description: |
        L'API repond mais ne renvoie aucun sous-compte. Portee de la cle trop
        etroite, ou filtre {$WASABI.SUBACCOUNT.STATUS} trop restrictif.
      tags:
        - tag: scope
          value: availability

    - uuid: '39eecbb3487f47e0ad12642b01c0075c'
      expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.wacm.truncated)=1'
      name: 'Wasabi: Sub-account list is truncated - some accounts are not monitored'
      priority: AVERAGE
      description: |
        Le plafond {$WASABI.SUBACCOUNT.MAX} a ete atteint : des sous-comptes
        eligibles ne sont pas collectes. Leurs items seront supprimes par la
        decouverte au bout de 7 jours, avec leur historique.

        Comparer "Number of sub-accounts eligible for collection" et
        "Number of sub-accounts" pour mesurer l'ecart, puis soit relever le
        plafond, soit restreindre {$WASABI.SUBACCOUNT.STATUS}.
      tags:
        - tag: scope
          value: availability

    - uuid: 'f2f3d7977d744bcf94f4776781b95620'
      expression: 'min(/Wasabi WACM Connect by HTTP/wasabi.wacm.duration,3h)>{$WASABI.DURATION.MAX}'
      name: 'Wasabi: Collection is approaching the 60s timeout'
      priority: WARNING
      description: |
        La collecte depasse {$WASABI.DURATION.MAX} s de facon durable. Au-dela de
        60 s l'item maitre echoue et toute la supervision Wasabi s'arrete.
        Filtrer les comptes inactifs via {$WASABI.SUBACCOUNT.STATUS}.
      tags:
        - tag: scope
          value: performance

    - uuid: '0d3876472b29429a88c75efa553d9804'
      expression: 'change(/Wasabi WACM Connect by HTTP/wasabi.wacm.accounts.total)>0'
      name: 'Wasabi: A sub-account has been added'
      priority: INFO
      manual_close: 'YES'
      description: |
        Un ou plusieurs sous-comptes sont apparus dans WACM depuis la derniere
        collecte. Information de suivi commercial, a acquitter manuellement.
      tags:
        - tag: scope
          value: lifecycle

    - uuid: 'fedfa1481c0b4f639da850cf49283dc0'
      expression: 'change(/Wasabi WACM Connect by HTTP/wasabi.wacm.accounts.total)<0'
      name: 'Wasabi: A sub-account has disappeared'
      priority: WARNING
      manual_close: 'YES'
      description: |
        Un ou plusieurs sous-comptes ne sont plus renvoyes par l'API : suppression
        effective, ou perte de visibilite de la cle sur ces comptes.
      tags:
        - tag: scope
          value: lifecycle
