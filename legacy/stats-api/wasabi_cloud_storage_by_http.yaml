          trigger_prototypes:
            - uuid: c6b7e832445e4f81bd856951eeb7309a
              expression: 'last(/Wasabi Cloud Storage by HTTP/wasabi.bucket.storage.raw["{#BUCKET}"])>{$WASABI.BUCKET.STORAGE.MAX:"{#BUCKET}"}'
              name: 'Wasabi bucket [{#BUCKET}]: Storage size is too high'
              priority: WARNING
              description: |
                Seuil surchargeable par bucket via un contexte de macro :
                {$WASABI.BUCKET.STORAGE.MAX:"nom-du-bucket"} = 5T
              tags:
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: scope
                  value: capacity

            - uuid: d3c7f39cdf0545139d7d6cd44a835f71
              expression: 'change(/Wasabi Cloud Storage by HTTP/wasabi.bucket.storage.raw["{#BUCKET}"])<0 and abs(change(/Wasabi Cloud Storage by HTTP/wasabi.bucket.storage.raw["{#BUCKET}"]))>last(/Wasabi Cloud Storage by HTTP/wasabi.bucket.storage.raw["{#BUCKET}"],#2)*{$WASABI.BUCKET.DROP.PCT}/100'
              name: 'Wasabi bucket [{#BUCKET}]: Storage size dropped by more than {$WASABI.BUCKET.DROP.PCT}%'
              priority: AVERAGE
              manual_close: 'YES'
              description: |
                Chute brutale du volume stocke : suppression massive, expiration de
                lifecycle inattendue ou compromission. A verifier.
              tags:
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: scope
                  value: security

            - uuid: f781a74c16d74f048e1f26f5e73c88c4
              expression: 'last(/Wasabi Cloud Storage by HTTP/wasabi.bucket.data_age["{#BUCKET}"])>{$WASABI.DATA.MAX_AGE}'
              name: 'Wasabi bucket [{#BUCKET}]: Utilization data is stale'
              priority: WARNING
              description: 'Aucun nouvel enregistrement d''utilisation depuis {$WASABI.DATA.MAX_AGE}.'
              tags:
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: scope
                  value: availability

          graph_prototypes:
            - uuid: 9dfa577e2eb544249ac5791e2b67def9
              name: 'Wasabi bucket [{#BUCKET}]: Storage'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Wasabi Cloud Storage by HTTP'
                    key: 'wasabi.bucket.storage.raw["{#BUCKET}"]'
                - sortorder: '1'
                  color: 2774A4
                  item:
                    host: 'Wasabi Cloud Storage by HTTP'
                    key: 'wasabi.bucket.storage.padded["{#BUCKET}"]'
                - sortorder: '2'
                  color: F63100
                  item:
                    host: 'Wasabi Cloud Storage by HTTP'
                    key: 'wasabi.bucket.storage.deleted["{#BUCKET}"]'

      tags:
        - tag: class
          value: cloud
        - tag: target
          value: wasabi

      macros:
        - macro: '{$WASABI.ACCESS.KEY}'
          description: 'Wasabi access key ID (cle ROOT ou avec permission billing).'
        - macro: '{$WASABI.SECRET.KEY}'
          type: SECRET_TEXT
          description: 'Wasabi secret access key.'
        - macro: '{$WASABI.API.URL}'
          value: 'https://stats.wasabisys.com'
          description: 'URL de base de la Wasabi Stats API.'
        - macro: '{$WASABI.API.MAX_PAGES}'
          value: '20'
          description: 'Nombre maximal de pages (100 buckets par page) parcourues par collecte.'
        - macro: '{$WASABI.BUCKETS}'
          value: ''
          description: |
            Liste de buckets separes par des virgules. Utilisee UNIQUEMENT en repli si
            l'endpoint /v1/standalone/utilizations/buckets n'est pas disponible sur le compte.
        - macro: '{$WASABI.HTTP.PROXY}'
          value: ''
          description: 'Proxy HTTP sortant, ex. http://proxy.local:3128. Vide = pas de proxy.'
        - macro: '{$WASABI.BUCKET.MATCHES}'
          value: '.*'
          description: 'LLD : ne decouvrir que les buckets dont le nom correspond a cette regexp.'
        - macro: '{$WASABI.BUCKET.NOT_MATCHES}'
          value: 'CHANGE_IF_NEEDED'
          description: 'LLD : ignorer les buckets dont le nom correspond a cette regexp.'
        - macro: '{$WASABI.BUCKET.STORAGE.MAX}'
          value: 10T
          description: 'Seuil d''alerte de volume par bucket. Surchargeable par contexte.'
        - macro: '{$WASABI.BUCKET.DROP.PCT}'
          value: '20'
          description: 'Pourcentage de chute de volume d''un bucket declenchant une alerte.'
        - macro: '{$WASABI.STORAGE.MAX}'
          value: 100T
          description: 'Seuil d''alerte de volume facture pour l''ensemble du compte.'
        - macro: '{$WASABI.DELETED.RATIO.MAX}'
          value: '25'
          description: 'Part maximale acceptable de stockage supprime encore facture (%).'
        - macro: '{$WASABI.DATA.MAX_AGE}'
          value: 48h
          description: 'Age maximal d''un enregistrement d''utilisation avant alerte.'

  triggers:
    - uuid: 5a136975c0834b0fa1ca213694e792c0
      expression: 'nodata(/Wasabi Cloud Storage by HTTP/wasabi.get.utilization,3h)=1'
      name: 'Wasabi: Failed to get data from the Stats API'
      priority: AVERAGE
      description: |
        Aucune donnee recuperee depuis 3h. Verifier :
        - les macros {$WASABI.ACCESS.KEY} et {$WASABI.SECRET.KEY} ;
        - que la cle est une cle ROOT ou possede la permission billing ;
        - la joignabilite de https://stats.wasabisys.com depuis le serveur ou proxy Zabbix ;
        - l'erreur exacte dans Latest data, item "Wasabi: Get utilization data".
      tags:
        - tag: scope
          value: availability

    - uuid: 2b3ab98ed3914dfbb8a63ed75c7a739c
      expression: 'last(/Wasabi Cloud Storage by HTTP/wasabi.account.data_age)>{$WASABI.DATA.MAX_AGE}'
      name: 'Wasabi: Account utilization data is stale'
      priority: WARNING
      description: 'Wasabi n''a produit aucun nouvel enregistrement d''utilisation depuis {$WASABI.DATA.MAX_AGE}.'
      tags:
        - tag: scope
          value: availability

    - uuid: 174403fbdf8944bc92c927f79f909926
      expression: 'last(/Wasabi Cloud Storage by HTTP/wasabi.account.storage.padded)>{$WASABI.STORAGE.MAX}'
      name: 'Wasabi: Billable storage is too high'
      priority: WARNING
      tags:
        - tag: scope
          value: capacity

    - uuid: aa01e65ed7d940378c2314e9f976a049
      expression: 'last(/Wasabi Cloud Storage by HTTP/wasabi.account.storage.min_charge)>0'
      name: 'Wasabi: Billed for unused capacity (below the 1 TB minimum)'
      priority: INFO
      description: |
        Le compte stocke moins que le minimum facturable de 1 To : une partie de la
        facture correspond a de la capacite non utilisee.
      tags:
        - tag: scope
          value: cost

    - uuid: 3d243c987f0f4a4b8e73027a7bcf96e4
      expression: 'min(/Wasabi Cloud Storage by HTTP/wasabi.account.storage.deleted.pct,1d)>{$WASABI.DELETED.RATIO.MAX}'
      name: 'Wasabi: More than {$WASABI.DELETED.RATIO.MAX}% of billed storage is deleted data'
      priority: WARNING
      description: |
        Une part importante de la facture correspond a des objets supprimes encore
        soumis a la retention minimale de 90 jours. Revoir les regles de lifecycle
        et la frequence des suppressions/reecritures.
      tags:
        - tag: scope
          value: cost

    - uuid: 88f0a23a81ed4940a48548c96a96ae5b
      expression: 'last(/Wasabi Cloud Storage by HTTP/wasabi.account.egress.30d)>last(/Wasabi Cloud Storage by HTTP/wasabi.account.storage.padded)'
      name: 'Wasabi: 30d egress exceeds stored volume (fair use policy)'
      priority: WARNING
      description: |
        L'egress cumule sur 30 jours depasse le volume stocke. La politique d'usage
        raisonnable de Wasabi attend un ratio inferieur ou egal a 1.
      tags:
        - tag: scope
          value: cost
