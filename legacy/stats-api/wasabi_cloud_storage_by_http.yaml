            - uuid: b5e1a43938754ec0a43ca36291768e5c
              name: 'Wasabi bucket [{#BUCKET}]: Metadata storage size'
              type: DEPENDENT
              key: 'wasabi.bucket.storage.metadata["{#BUCKET}"]'
