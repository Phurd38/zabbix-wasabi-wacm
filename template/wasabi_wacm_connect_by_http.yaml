            - uuid: 'e818671b2610477aaada01d5707ca5be'
              name: 'Sub-account [{#SUBNAME}]: Ingress per day'
              type: DEPENDENT
              key: 'wasabi.sub.ingress["{#SUBID}"]'
              delay: '0'
              value_type: FLOAT
              units: B
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.accounts['{#SUBID}'].ingress
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: component
                  value: network

            - uuid: 'bece5fe77f94402c969b9f9f0f66a8c6'
              name: 'Sub-account [{#SUBNAME}]: Egress, 30d'
              type: CALCULATED
              key: 'wasabi.sub.egress.30d["{#SUBID}"]'
              delay: 1h
              value_type: FLOAT
              units: B
              params: 'sum(//wasabi.sub.egress["{#SUBID}"],30d)'
              description: |
                Egress cumule sur 30 jours. La politique d'usage raisonnable de
                Wasabi attend un egress mensuel inferieur au volume stocke.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: component
                  value: network

          trigger_prototypes:
            - uuid: 'dd6c012a8c464a019bd026458b3ae8be'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.quota.pct["{#SUBID}"])>={$WASABI.QUOTA.CRIT}'
              name: 'Sub-account [{#SUBNAME}]: Storage quota exceeded (>={$WASABI.QUOTA.CRIT}%)'
              priority: AVERAGE
              description: |
                Le quota applicable est depasse. En Soft quota rien n'est bloque mais
                le depassement est facture ; en Hard quota les ecritures sont refusees.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: capacity

            - uuid: '43bd247d9e9d4872bee397298a281d3c'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.quota.pct["{#SUBID}"])>={$WASABI.QUOTA.HIGH}'
              name: 'Sub-account [{#SUBNAME}]: Storage quota above {$WASABI.QUOTA.HIGH}%'
              priority: WARNING
              dependencies:
                - name: 'Sub-account [{#SUBNAME}]: Storage quota exceeded (>={$WASABI.QUOTA.CRIT}%)'
                  expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.quota.pct["{#SUBID}"])>={$WASABI.QUOTA.CRIT}'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: capacity

            - uuid: 'af5b2218e3764972b34c8c839e1783f9'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.quota.pct["{#SUBID}"])>={$WASABI.QUOTA.WARN}'
              name: 'Sub-account [{#SUBNAME}]: Storage quota above {$WASABI.QUOTA.WARN}%'
              priority: INFO
              dependencies:
                - name: 'Sub-account [{#SUBNAME}]: Storage quota above {$WASABI.QUOTA.HIGH}%'
                  expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.quota.pct["{#SUBID}"])>={$WASABI.QUOTA.HIGH}'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: capacity

            - uuid: '4e337553eb4c464a918c46bf7b01aee6'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.quota.source["{#SUBID}"])="none"'
              name: 'Sub-account [{#SUBNAME}]: No quota defined'
              priority: INFO
              manual_close: 'YES'
              description: |
                Ni quota souscrit ni quota d'essai : aucune surveillance de
                capacite n'est possible sur ce compte.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: capacity

            - uuid: 'ae4a92a6d90240e694c8839b0d925710'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.trial.days["{#SUBID}"])<={$WASABI.TRIAL.DAYS.WARN} and last(/Wasabi WACM Connect by HTTP/wasabi.sub.trial.days["{#SUBID}"])>=0'
              name: 'Sub-account [{#SUBNAME}]: Trial expires in less than {$WASABI.TRIAL.DAYS.WARN} days'
              priority: WARNING
              description: |
                La periode d'essai touche a sa fin. Sans conversion en compte payant,
                le service sera interrompu.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: lifecycle

            - uuid: '28e784553d0d46e4a3a2b30e4b567772'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.trial.days["{#SUBID}"])<0'
              name: 'Sub-account [{#SUBNAME}]: Trial has expired'
              priority: AVERAGE
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: lifecycle

            - uuid: '1cd318c9208046d2a524f5af17a90340'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.status["{#SUBID}"])="PENDING_DELETION"'
              name: 'Sub-account [{#SUBNAME}]: Pending deletion'
              priority: HIGH
              manual_close: 'YES'
              description: |
                Le sous-compte va etre supprime, ainsi que toutes ses donnees.
                Verifier que la suppression est bien intentionnelle.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: lifecycle

            - uuid: '9b70f193da624add873fb98b605100e1'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.status["{#SUBID}"])="SUSPENDED"'
              name: 'Sub-account [{#SUBNAME}]: Suspended'
              priority: AVERAGE
              description: 'Compte suspendu : acces aux donnees interrompu.'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: lifecycle

            - uuid: '5a8f3bf1a71546be9703728d0456f707'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.mfa["{#SUBID}"])=0 and {$WASABI.MFA.ALERT}=1'
              name: 'Sub-account [{#SUBNAME}]: MFA is disabled'
              priority: INFO
              description: |
                Authentification multifacteur desactivee sur ce sous-compte.
                Mettre {$WASABI.MFA.ALERT} a 0 pour desactiver ce controle.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: security

            - uuid: 'ebf0a4ad4c324fac8dbf282b4355d33d'
              expression: 'last(/Wasabi WACM Connect by HTTP/wasabi.sub.egress.30d["{#SUBID}"])>last(/Wasabi WACM Connect by HTTP/wasabi.sub.storage.active["{#SUBID}"])'
              name: 'Sub-account [{#SUBNAME}]: 30d egress exceeds stored volume'
              priority: WARNING
              manual_close: 'YES'
              description: |
                L'egress cumule sur 30 jours depasse le volume stocke. La politique
                d'usage raisonnable de Wasabi attend un ratio inferieur ou egal a 1.
                Les items "Egress, 30d" par bucket permettent d'identifier la source.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: scope
                  value: cost

          graph_prototypes:
            - uuid: 'e79749c36a274291a971a637b190ac99'
              name: 'Sub-account [{#SUBNAME}]: Storage vs quota'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Wasabi WACM Connect by HTTP'
                    key: 'wasabi.sub.storage.active["{#SUBID}"]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'Wasabi WACM Connect by HTTP'
                    key: 'wasabi.sub.storage.deleted["{#SUBID}"]'
                - sortorder: '2'
                  color: 2774A4
                  drawtype: BOLD_LINE
                  item:
                    host: 'Wasabi WACM Connect by HTTP'
                    key: 'wasabi.sub.quota.effective["{#SUBID}"]'

        - uuid: 'f8b53104e92641dfaa8bb84551f8965e'
          name: 'Wasabi: Bucket discovery'
          type: DEPENDENT
          key: wasabi.wacm.buckets.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#BUCKET}'
                value: '{$WASABI.BUCKET.MATCHES}'
                formulaid: A
              - macro: '{#BUCKET}'
                value: '{$WASABI.BUCKET.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 7d
          master_item:
            key: wasabi.wacm.get
          description: |
            Decouvre tous les buckets de tous les sous-comptes.
            Zabbix ne gere pas la decouverte imbriquee : la cle de chaque item
            porte donc l'identifiant du sous-compte ET le nom du bucket.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.discovery_buckets
          item_prototypes:
            - uuid: 'f04380221b5645419e416b6a62dd9ef7'
              name: 'Bucket [{#SUBNAME}/{#BUCKET}]: Active storage'
              type: DEPENDENT
              key: 'wasabi.bucket.storage.active["{#SUBID}","{#BUCKET}"]'
              delay: '0'
              value_type: FLOAT
              units: B
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.buckets['{#SUBID}/{#BUCKET}'].activeStorage
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000000'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: bucket
                  value: '{#BUCKET}'
                - tag: component
                  value: storage

            - uuid: '109f8d3e67b34d36886c9f9f0da08cfb'
