          type: CALCULATED
          key: wasabi.account.storage.deleted.pct
          delay: 1h
          value_type: FLOAT
          units: '%'
          params: '100*last(//wasabi.account.storage.deleted)/(last(//wasabi.account.storage.raw)+1)'
          description: |
            Part du stockage facture correspondant a des objets deja supprimes mais
            encore soumis a la retention minimale de 90 jours.
          tags:
            - tag: component
              value: billing

        - uuid: 33039be2897d4e47b6fd70004cfbaf3c
          name: 'Wasabi: Egress, 30d'
          type: CALCULATED
          key: wasabi.account.egress.30d
          delay: 1h
          value_type: FLOAT
          units: B
          params: 'sum(//wasabi.account.download_bytes,30d)'
          description: |
            Egress cumule sur 30 jours. La politique d'usage raisonnable Wasabi
            attend un egress mensuel inferieur ou egal au volume stocke.
          tags:
            - tag: component
              value: network

      discovery_rules:
        - uuid: eca6b231d5fa4e649df688199dcc871a
          name: 'Wasabi: Bucket discovery'
          type: DEPENDENT
          key: wasabi.buckets.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#BUCKET}'
                value: '{$WASABI.BUCKET.MATCHES}'
                formulaid: A
              - macro: '{#BUCKET}'
                value: '{$WASABI.BUCKET.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 7d
          master_item:
            key: wasabi.get.utilization
          description: 'Decouvre tous les buckets remontes par la Stats API.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.discovery
          item_prototypes:
            - uuid: 81a1a78bf35f485a8ae5b0dc731eec43
              name: 'Wasabi bucket [{#BUCKET}]: Raw storage size'
              type: DEPENDENT
              key: 'wasabi.bucket.storage.raw["{#BUCKET}"]'
              delay: '0'
              value_type: FLOAT
              units: B
              master_item:
                key: wasabi.get.utilization
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.buckets['{#BUCKET}'].RawStorageSizeBytes
                  error_handler: DISCARD_VALUE
              tags:
