              value: network

        - uuid: 06fe94fbaa364fb4bc65cae9d3ed8d83
          name: 'Wasabi: Utilization data age'
          type: DEPENDENT
          key: wasabi.account.data_age
          delay: '0'
          value_type: FLOAT
          units: s
          master_item:
            key: wasabi.get.utilization
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.account.age_seconds
              error_handler: DISCARD_VALUE
          description: |
            Age du dernier enregistrement d'utilisation (now - EndTime).
            Wasabi genere un enregistrement par jour : une valeur superieure a 48h
            signale un probleme cote Wasabi ou une cle sans permission de facturation.
          tags:
            - tag: component
              value: health

        - uuid: 60383920981343a7bd7b45eb78421d52
          name: 'Wasabi: Number of buckets'
          type: DEPENDENT
          key: wasabi.buckets.count
