zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: '01087e30369544098cf4e7572bf43569'
      name: 'Templates/Cloud'
  templates:
    - uuid: '899906149869416dbb50cccdcc797f19'
      template: 'Wasabi WACM Connect by HTTP'
      name: 'Wasabi WACM Connect by HTTP'
      description: |
        Supervision d'un parc Wasabi gere dans WACM (Wasabi Account Control Manager)
        via la WACM Connect API : tous les sous-comptes et tous leurs buckets.

        API : https://api.wacm.wasabisys.com
          GET /api/v1/sub-accounts/
          GET /api/v1/sub-accounts/{id}/buckets

        Authentification : HTTP Basic.
          - Cle utilisateur : identifiant = login WACM, mot de passe = cle API
            (Mon profil > WACM Connect)
          - Cle de compte  : identifiant = nom du compte, mot de passe = cle API
            (onglet Account, role Account Admin requis)

        NOTE : l'endpoint /utilizations n'existe pas dans WACM Connect (404).
        Les metriques au niveau du compte proviennent de /sub-accounts.

        UNITES renvoyees par l'API (converties en octets par preprocessing) :
          activeStorage, deletedStorage, storageWrote, storageRead -> To
          egress, ingress                                          -> Go
        La conversion utilise le To decimal (1 To = 10^12 octets), comme la
        facturation Wasabi. storageWrote et storageRead sont supposes en To :
        valeurs nulles lors de la mise au point, unite non recoupee.

        QUOTA : purchasedStorageTB pour un compte payant, trialQuotaTB pour un
        compte en essai. L'item "Quota source" indique lequel s'applique.

        NOMBRE D'APPELS : 1 appel pour la liste des sous-comptes, puis 1 appel
        par sous-compte pour ses buckets. Utilisez {$WASABI.SUBACCOUNT.STATUS}
        pour ecarter les comptes inactifs et rester sous le timeout de 60 s.
        L'item "Collection duration" et le drapeau "Sub-account list truncated"
        signalent une collecte qui approche de ses limites.

        Prerequis :
          1. Renseigner {$WASABI.WACM.USER} et {$WASABI.WACM.KEY} sur l'hote.
          2. Le serveur ou proxy Zabbix doit joindre https://api.wacm.wasabisys.com.
          3. Zabbix >= 7.0 (grille de dashboard a 72 colonnes).
      vendor:
        name: Community
        version: 7.0-2
      groups:
        - name: 'Templates/Cloud'
      items:
        - uuid: '9de9ca1a5b9f42ebaa72a7042123f4ab'
          name: 'Wasabi: Get WACM data'
          type: SCRIPT
          key: wasabi.wacm.get
          delay: 1h
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            var params = JSON.parse(value);

            var t0 = Date.now();
            var baseUrl = (params.base_url || 'https://api.wacm.wasabisys.com').replace(/\/+$/, '');
            var user = params.username || '';
            var key = params.api_key || '';
            var maxAccounts = parseInt(params.max_accounts || '50', 10);
            var includeDeleted = String(params.include_deleted || 'false') === 'true';
            var statusFilter = String(params.status_filter || '').toUpperCase();

            if (user === '' || user.indexOf('{$') === 0) {
                throw 'WACM username is not set - fill the {$WASABI.WACM.USER} macro. '
                    + 'It is your WACM login, not the name of the API key.';
            }
            if (key === '' || key.indexOf('{$') === 0) {
                throw 'WACM API key is not set - fill the {$WASABI.WACM.KEY} macro.';
            }

            // ---- base64 (le moteur JS de Zabbix n'expose pas btoa de facon fiable)
            var B64CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

            function base64(str) {
                var out = '', i = 0, c1, c2, c3, e1, e2, e3, e4;

                while (i < str.length) {
                    c1 = str.charCodeAt(i++);
                    c2 = str.charCodeAt(i++);
                    c3 = str.charCodeAt(i++);

                    e1 = c1 >> 2;
                    e2 = ((c1 & 3) << 4) | (c2 >> 4);
                    e3 = ((c2 & 15) << 2) | (c3 >> 6);
                    e4 = c3 & 63;

                    if (isNaN(c2)) {
                        e3 = 64;
                        e4 = 64;
                    }
                    else if (isNaN(c3)) {
                        e4 = 64;
                    }

                    out += B64CHARS.charAt(e1) + B64CHARS.charAt(e2)
                        + (e3 === 64 ? '=' : B64CHARS.charAt(e3))
                        + (e4 === 64 ? '=' : B64CHARS.charAt(e4));
                }
                return out;
            }

            var authHeader = 'Authorization: Basic ' + base64(user + ':' + key);

            function apiGet(path) {
                var req = new HttpRequest();

                if (params.proxy) {
                    req.setHttpProxy(params.proxy);
                }
                req.addHeader(authHeader);
                req.addHeader('Accept: application/json');

                var body = req.get(baseUrl + path);
                var status = req.getStatus();

                if (status === 401) {
                    throw 'HTTP 401 on ' + path + '. Check {$WASABI.WACM.USER}: it must be the '
                        + 'WACM login (or the account name for an account key), not the key name.';
                }
                if (status === 403) {
                    throw 'HTTP 403 on ' + path + '. The key is valid but lacks rights on this resource.';
                }
                if (status === 404) {
                    return null;
                }
                if (status < 200 || status >= 300) {
                    throw 'Request to ' + path + ' failed: HTTP ' + status + ' '
                        + String(body).substring(0, 200);
                }
                try {
                    return JSON.parse(body);
                }
                catch (e) {
                    throw 'Cannot parse JSON response from ' + path;
                }
            }

            // Toutes les reponses ont la forme
            //   { success, code, message, data: { items: [...], page, size, total }, errors }
            function items(resp) {
                if (!resp || !resp.data) {
                    return [];
                }
                if (resp.data.items) {
                    return resp.data.items;
                }
                return [];
            }

            function totalOf(resp, fallback) {
                if (resp && resp.data && typeof resp.data.total === 'number') {
                    return resp.data.total;
                }
                return fallback;
            }

            function num(v) {
                return (typeof v === 'number' && !isNaN(v)) ? v : null;
            }

            function toEpoch(s) {
                if (!s) {
                    return null;
                }
                var t = Date.parse(s);
                return isNaN(t) ? null : Math.floor(t / 1000);
            }

            var now = Math.floor(Date.now() / 1000);
            var out = {
                accounts: {},
                buckets: {},
                discovery_accounts: [],
                discovery_buckets: [],
                account_count: 0,
                bucket_count: 0,
                accounts_total: 0,
                accounts_eligible: 0,
                truncated: 0,
                duration_s: 0
            };

            // ---------- 1. sous-comptes ----------
            var accounts = [], page = 0, total = 1, apiTotal = 0;

            while (accounts.length < total && page < 20) {
                var q = '/api/v1/sub-accounts/?page=' + page + '&size=100';
                if (includeDeleted) {
                    q += '&includeDeleted=true';
                }
                var resp = apiGet(q);
                var batch = items(resp);

                for (var i = 0; i < batch.length; i++) {
                    accounts.push(batch[i]);
                }
                total = totalOf(resp, accounts.length);
                apiTotal = total;
                page++;

                if (batch.length === 0) {
                    break;
                }
            }

            out.accounts_total = apiTotal;

            // filtre optionnel sur le statut, applique AVANT d'aller chercher les buckets
            if (statusFilter !== '') {
                var wanted = statusFilter.split(',');
                var kept = [];

                for (var a = 0; a < accounts.length; a++) {
                    for (var w = 0; w < wanted.length; w++) {
                        if (String(accounts[a].status).toUpperCase() === wanted[w].replace(/^\s+|\s+$/g, '')) {
                            kept.push(accounts[a]);
                            break;
                        }
                    }
                }
                accounts = kept;
            }

            // Nombre de comptes qui DEVRAIENT etre collectes, avant plafonnement.
            // La difference avec account_count est une perte silencieuse de supervision.
            out.accounts_eligible = accounts.length;

            if (accounts.length > maxAccounts) {
                accounts = accounts.slice(0, maxAccounts);
                out.truncated = 1;
            }

            // ---------- 2. buckets de chaque sous-compte ----------
            for (var n = 0; n < accounts.length; n++) {
                var acc = accounts[n];
                var id = String(acc.id);

                var active = num(acc.activeStorage);
                var purchased = num(acc.purchasedStorageTB);
                var trialTb = num(acc.trialQuotaTB);

                // Un compte en essai n'a pas de purchasedStorageTB : le quota
                // applicable est alors trialQuotaTB.
                var quotaTb = null, quotaSource = 'none';

                if (purchased !== null && purchased > 0) {
                    quotaTb = purchased;
                    quotaSource = 'purchased';
                }
                else if (trialTb !== null && trialTb > 0) {
                    quotaTb = trialTb;
                    quotaSource = 'trial';
                }

                acc.quota_tb = quotaTb;
                acc.quota_source = quotaSource;
                acc.quota_pct = (active !== null && quotaTb) ? (active / quotaTb * 100) : null;

                var texp = toEpoch(acc.trialExpiration);
                acc.trial_days_left = (texp === null) ? null : Math.floor((texp - now) / 86400);

                acc.mfa = acc.mfaEnabled ? 1 : 0;
                acc.ftp = acc.ftpEnabled ? 1 : 0;
                acc.sso = acc.ssoEnabled ? 1 : 0;
                acc.bucket_count = 0;
                acc.egress = 0;
                acc.ingress = 0;
                acc.api_calls = 0;

                var bresp = apiGet('/api/v1/sub-accounts/' + encodeURIComponent(id)
                    + '/buckets?latest=true&page=0&size=100');
                var blist = items(bresp);

                // pagination des buckets
                var btotal = totalOf(bresp, blist.length), bpage = 1;

                while (blist.length < btotal && bpage < 20) {
                    var more = items(apiGet('/api/v1/sub-accounts/' + encodeURIComponent(id)
                        + '/buckets?latest=true&page=' + bpage + '&size=100'));
                    if (more.length === 0) {
                        break;
                    }
                    for (var m = 0; m < more.length; m++) {
                        blist.push(more[m]);
                    }
                    bpage++;
                }

                for (var b = 0; b < blist.length; b++) {
                    var bk = blist[b];
                    if (!bk.name) {
                        continue;
                    }
                    var bkey = id + '/' + bk.name;
                    var end = toEpoch(bk.endTime);

                    bk.age_seconds = (end === null) ? -1 : (now - end);
                    bk.is_deleted = bk.bucketDeleteTime ? 1 : 0;
                    bk.delete_time = bk.bucketDeleteTime || '';

                    acc.egress += (num(bk.egress) || 0);
                    acc.ingress += (num(bk.ingress) || 0);
                    acc.api_calls += (num(bk.apiCalls) || 0);

                    out.buckets[bkey] = bk;
                    out.discovery_buckets.push({
                        '{#SUBID}': id,
                        '{#SUBNAME}': acc.name || id,
                        '{#BUCKET}': bk.name,
                        '{#REGION}': bk.region || 'unknown',
                        '{#BUCKETNUM}': String(bk.bucketNumber || '')
                    });
                    acc.bucket_count++;
                }

                out.accounts[id] = acc;
                out.discovery_accounts.push({
                    '{#SUBID}': id,
                    '{#SUBNAME}': acc.name || id,
                    '{#WASABIACCT}': String(acc.wasabiAccountNumber || ''),
                    '{#STATUS}': acc.status || 'UNKNOWN'
                });
            }

            out.account_count = out.discovery_accounts.length;
            out.bucket_count = out.discovery_buckets.length;
            out.duration_s = (Date.now() - t0) / 1000;

            return JSON.stringify(out);
          timeout: 60s
          parameters:
            - name: username
              value: '{$WASABI.WACM.USER}'
            - name: api_key
              value: '{$WASABI.WACM.KEY}'
            - name: base_url
              value: '{$WASABI.WACM.URL}'
            - name: max_accounts
              value: '{$WASABI.SUBACCOUNT.MAX}'
            - name: status_filter
              value: '{$WASABI.SUBACCOUNT.STATUS}'
            - name: include_deleted
              value: '{$WASABI.SUBACCOUNT.INCLUDE_DELETED}'
            - name: proxy
              value: '{$WASABI.HTTP.PROXY}'
          description: |
            Item maitre. Recupere la liste des sous-comptes puis les buckets de
            chacun, et renvoie un JSON unique dont derivent tous les autres items.
          tags:
            - tag: component
              value: raw

        - uuid: 'a66e050a3cd04d33b89ae62085e9cdad'
          name: 'Wasabi: Number of sub-accounts'
          type: DEPENDENT
          key: wasabi.wacm.accounts.count
          delay: '0'
          value_type: FLOAT
          master_item:
            key: wasabi.wacm.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.account_count
              error_handler: DISCARD_VALUE
          description: 'Sous-comptes reellement collectes.'
          tags:
            - tag: component
              value: inventory

        - uuid: '52e8c9f9ffb24cafae783b52617828e2'
          name: 'Wasabi: Number of sub-accounts reported by the API'
          type: DEPENDENT
          key: wasabi.wacm.accounts.total
          delay: '0'
          value_type: FLOAT
          master_item:
            key: wasabi.wacm.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.accounts_total
              error_handler: DISCARD_VALUE
          description: |
            Total annonce par l'API, avant tout filtre et tout plafonnement.
            Sert de reference pour detecter une troncature ou l'apparition
            d'un nouveau compte.
          tags:
            - tag: component
              value: inventory

        - uuid: '30c9f1934f7f4e4a98e559b6c3841e90'
          name: 'Wasabi: Number of sub-accounts eligible for collection'
          type: DEPENDENT
          key: wasabi.wacm.accounts.eligible
          delay: '0'
          value_type: FLOAT
          master_item:
            key: wasabi.wacm.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.accounts_eligible
              error_handler: DISCARD_VALUE
          description: |
            Comptes retenus apres le filtre de statut, avant plafonnement par
            {$WASABI.SUBACCOUNT.MAX}. Un ecart avec le nombre collecte signifie
            que des comptes ne sont plus supervises.
          tags:
            - tag: component
              value: inventory

        - uuid: 'e2e00b8cffb14bed9e5142044bd4daff'
          name: 'Wasabi: Sub-account list truncated'
          type: DEPENDENT
          key: wasabi.wacm.truncated
          delay: '0'
          value_type: UNSIGNED
          valuemap:
            name: 'Yes/No'
          master_item:
            key: wasabi.wacm.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.truncated
              error_handler: DISCARD_VALUE
          description: |
            A 1, des sous-comptes eligibles n'ont pas ete collectes parce que
            {$WASABI.SUBACCOUNT.MAX} a ete atteint. Leurs items finiront par etre
            supprimes par la decouverte, avec leur historique.
          tags:
            - tag: component
              value: health

        - uuid: 'c499294a27b84238b93ccb00ab1e9ff8'
          name: 'Wasabi: Collection duration'
          type: DEPENDENT
          key: wasabi.wacm.duration
          delay: '0'
          value_type: FLOAT
          units: s
          master_item:
            key: wasabi.wacm.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.duration_s
              error_handler: DISCARD_VALUE
          description: |
            Duree totale de la collecte. Le timeout de l'item maitre est de 60 s :
            au-dela de 45 s, il faut filtrer les comptes inactifs.
          tags:
            - tag: component
              value: health

        - uuid: 'adc3cc340a4841ed99206f6dde7c93e8'
          name: 'Wasabi: Number of buckets, all sub-accounts'
          type: DEPENDENT
          key: wasabi.wacm.buckets.count
          delay: '0'
          value_type: FLOAT
          master_item:
            key: wasabi.wacm.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.bucket_count
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: inventory

        - uuid: 'e01a664fa81844caad4ea54e70b6e6f6'
          name: 'Wasabi: Total active storage, all sub-accounts'
          type: CALCULATED
          key: wasabi.total.storage.active
          delay: 1h
          value_type: FLOAT
          units: B
          params: 'sum(last_foreach(//wasabi.sub.storage.active[*]))'
          tags:
            - tag: component
              value: aggregate

        - uuid: '53db963148324cdda6b520d28484750a'
          name: 'Wasabi: Total deleted storage, all sub-accounts'
          type: CALCULATED
          key: wasabi.total.storage.deleted
          delay: 1h
          value_type: FLOAT
          units: B
          params: 'sum(last_foreach(//wasabi.sub.storage.deleted[*]))'
          tags:
            - tag: component
              value: aggregate

        - uuid: 'c491af92104b4a4db4d060cc038cac84'
          name: 'Wasabi: Total quota sold, all sub-accounts'
          type: CALCULATED
          key: wasabi.total.storage.quota
          delay: 1h
          value_type: FLOAT
          units: B
          params: 'sum(last_foreach(//wasabi.sub.quota.effective[*]))'
          tags:
            - tag: component
              value: aggregate

        - uuid: '4ae46416e1f94e02b5060a67cda29ddd'
          name: 'Wasabi: Overall quota usage'
          type: CALCULATED
          key: wasabi.total.quota.pct
          delay: 1h
          value_type: FLOAT
          units: '%'
          params: '100*last(//wasabi.total.storage.active)/(last(//wasabi.total.storage.quota)+1)'
          description: 'Taux d''occupation du parc : stockage utilise sur quota vendu.'
          tags:
            - tag: component
              value: aggregate

        - uuid: '6a5004776d964897a2940d0d685d0ec1'
          name: 'Wasabi: Deleted storage ratio, all sub-accounts'
          type: CALCULATED
          key: wasabi.total.deleted.pct
          delay: 1h
          value_type: FLOAT
          units: '%'
          params: '100*last(//wasabi.total.storage.deleted)/(last(//wasabi.total.storage.active)+1)'
          description: |
            Part du parc facturee au titre de la retention 90 jours sur des donnees
            deja supprimees.
          tags:
            - tag: component
              value: aggregate

        - uuid: '92e5d0cded7843859f457ba747c4f6f6'
          name: 'Wasabi: Total egress, 30d'
          type: CALCULATED
          key: wasabi.total.egress.30d
          delay: 1h
          value_type: FLOAT
          units: B
          params: 'sum(last_foreach(//wasabi.sub.egress.30d[*]))'
          tags:
            - tag: component
              value: aggregate

      discovery_rules:
        - uuid: '0e295b644a7548bfb09ba78f442cdf4e'
          name: 'Wasabi: Sub-account discovery'
          type: DEPENDENT
          key: wasabi.wacm.subaccounts.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SUBNAME}'
                value: '{$WASABI.SUBACCOUNT.MATCHES}'
                formulaid: A
              - macro: '{#SUBNAME}'
                value: '{$WASABI.SUBACCOUNT.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 7d
          master_item:
            key: wasabi.wacm.get
          description: 'Decouvre les sous-comptes WACM visibles par la cle API.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.discovery_accounts
          item_prototypes:
            - uuid: '4d125646495e4a02b87b663a9c2de75f'
              name: 'Sub-account [{#SUBNAME}]: Active storage'
              type: DEPENDENT
              key: 'wasabi.sub.storage.active["{#SUBID}"]'
              delay: '0'
              value_type: FLOAT
              units: B
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.accounts['{#SUBID}'].activeStorage
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000000'
              description: 'Renvoye en To par l''API, converti en octets (1 To = 10^12).'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: component
                  value: storage

            - uuid: 'cf3534e94a7643a1a9846d5f208f70a8'
              name: 'Sub-account [{#SUBNAME}]: Deleted storage'
              type: DEPENDENT
              key: 'wasabi.sub.storage.deleted["{#SUBID}"]'
              delay: '0'
              value_type: FLOAT
              units: B
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.accounts['{#SUBID}'].deletedStorage
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000000'
              description: |
                Objets supprimes encore factures au titre de la retention minimale
                de 90 jours.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: component
                  value: storage

            - uuid: 'eac545b9acdd43869b7ffa67abcb33eb'
              name: 'Sub-account [{#SUBNAME}]: Purchased storage'
              type: DEPENDENT
              key: 'wasabi.sub.storage.purchased["{#SUBID}"]'
              delay: '0'
              value_type: FLOAT
              units: B
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.accounts['{#SUBID}'].purchasedStorageTB
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000000'
              description: 'Vide pour un compte en essai : voir "Effective quota".'
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: component
                  value: quota

            - uuid: '1c26792bf8db4fdc8f8c1b4e780805c7'
              name: 'Sub-account [{#SUBNAME}]: Effective quota'
              type: DEPENDENT
              key: 'wasabi.sub.quota.effective["{#SUBID}"]'
              delay: '0'
              value_type: FLOAT
              units: B
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.accounts['{#SUBID}'].quota_tb
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1000000000000'
              description: |
                Quota reellement applicable : purchasedStorageTB pour un compte
                payant, trialQuotaTB pour un compte en essai.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: component
                  value: quota

            - uuid: 'affd761f2c27434da4d14bd3f600d1c1'
              name: 'Sub-account [{#SUBNAME}]: Quota source'
              type: DEPENDENT
              key: 'wasabi.sub.quota.source["{#SUBID}"]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: CHAR
              master_item:
                key: wasabi.wacm.get
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.accounts['{#SUBID}'].quota_source
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              description: |
                purchased = quota souscrit, trial = quota d'essai,
                none = aucun quota defini, le taux d'occupation est alors sans objet.
              tags:
                - tag: subaccount
                  value: '{#SUBNAME}'
                - tag: component
                  value: quota

            - uuid: 'acd4834e036541e0aa12e7621ad241ab'
              name: 'Sub-account [{#SUBNAME}]: Quota usage'
              type: DEPENDENT
              key: 'wasabi.sub.quota.pct["{#SUBID}"]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              master_item:
                key: wasabi.wacm.get
              preprocessing:
