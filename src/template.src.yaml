                  x: '18'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
                        key: wasabi.total.storage.deleted
                - type: item
                  name: 'Occupation du quota vendu'
                  x: '36'
                  width: '18'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        host: 'Wasabi WACM Connect by HTTP'
